name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  workspace-build:
    name: Workspace Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install protobuf compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Build all workspace targets
        run: cargo check --workspace --all-targets --locked

  clippy:
    name: Clippy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install protobuf compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Lint all workspace targets
        run: cargo clippy --workspace --all-targets --locked

  embeddings-tests:
    name: Embeddings Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # `key` scopes this job's cache. `ort-sys` (via fastembed) downloads a prebuilt
      # ONNX Runtime in its build script and records an absolute link-search path; when a
      # restored cache carries that recorded path but not the downloaded library, the crate
      # fails to link with "could not find native static library `onnxruntime`" and no
      # rebuild is attempted. Because CACHE_ON_FAILURE is false, a poisoned cache is never
      # replaced and every retry fails identically. Bump this value to evict it.
      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: ort-1

      - name: Build mempalace-embeddings tests
        run: cargo test -p mempalace-embeddings --locked --no-run

      - name: Run mempalace-embeddings tests
        run: cargo test -p mempalace-embeddings --locked -- --nocapture

  remaining-package-tests:
    name: ${{ matrix.package }} Tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - mempalace-a2a
          - mempalace-config
          - mempalace-core
          - mempalace-dialect
          - mempalace-federation
          - mempalace-import
          - mempalace-remote
          - mempalace-search
          - mempalace-server

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install protobuf compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Build ${{ matrix.package }} tests
        run: cargo test -p ${{ matrix.package }} --locked --no-run

      - name: Run ${{ matrix.package }} tests
        run: cargo test -p ${{ matrix.package }} --locked -- --nocapture

  embedding-baselines:
    name: Embedding Baselines
    runs-on: ubuntu-latest
    needs: embeddings-tests
    timeout-minutes: 30
    env:
      MEMPALACE_EMBED_CACHE: /home/runner/.cache/mempalace/embeddings
      MEMPALACE_EMBED_ALLOW_DOWNLOADS: "1"
      MEMPALACE_EMBED_ITERATIONS: "15"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Cache embedding assets
        uses: actions/cache@v6
        with:
          path: ${{ env.MEMPALACE_EMBED_CACHE }}
          key: embedding-assets-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}

      - name: Capture balanced warm baseline
        run: |
          cargo run -p mempalace-embeddings --example embedding_bench --release --locked \
            | tee balanced-benchmark.txt

      - name: Capture low_cpu warm baseline
        run: |
          MEMPALACE_EMBED_PROFILE=low_cpu \
            cargo run -p mempalace-embeddings --example embedding_bench --release --locked \
            | tee low-cpu-benchmark.txt

      - name: Publish embedding benchmark summary
        run: |
          {
            echo "## Embedding Baselines"
            echo
            echo "$(cat balanced-benchmark.txt)"
            echo "$(cat low-cpu-benchmark.txt)"
            echo
            echo "Reference host: github-actions ubuntu-latest"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload embedding benchmark artifacts
        uses: actions/upload-artifact@v7
        with:
          name: embedding-baselines
          path: |
            balanced-benchmark.txt
            low-cpu-benchmark.txt

  storage-tests:
    name: Storage Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install protobuf compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Build mempalace-storage tests
        run: cargo test -p mempalace-storage --locked --no-run

      - name: Run mempalace-storage tests
        run: cargo test -p mempalace-storage --locked -- --nocapture

  ingest-tests:
    name: Ingest Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install protobuf compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Build mempalace-ingest tests
        run: cargo test -p mempalace-ingest --locked --no-run

      - name: Run mempalace-ingest tests
        run: cargo test -p mempalace-ingest --locked -- --nocapture

  graph-tests:
    name: Graph Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install protobuf compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Build mempalace-graph tests
        run: cargo test -p mempalace-graph --locked --no-run

      - name: Run mempalace-graph tests
        run: cargo test -p mempalace-graph --locked -- --nocapture

  mcp-tests:
    name: MCP Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install protobuf compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Build mempalace-mcp tests
        run: cargo test -p mempalace-mcp --locked --no-run

      - name: Run mempalace-mcp tests
        run: cargo test -p mempalace-mcp --locked -- --nocapture

  cli-tests:
    name: CLI Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install protobuf compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Build mempalace-cli tests
        run: cargo test -p mempalace-cli --locked --no-run

      - name: Run mempalace-cli tests
        run: cargo test -p mempalace-cli --locked -- --nocapture

  release-contract-tests:
    name: Release Contract Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate shell syntax
        run: bash -n install.sh release/*.sh release/tests/*.sh scripts/*.sh

      - name: Validate PowerShell installer syntax
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path install.ps1),
            [ref]$tokens,
            [ref]$errors
          )
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_ }
            exit 1
          }

      - name: Exercise signed release contract
        run: bash release/tests/release-contract.sh

  release-gate:
    name: Release Gate
    runs-on: ubuntu-latest
    needs:
      - workspace-build
      - clippy
      - embeddings-tests
      - remaining-package-tests
      - embedding-baselines
      - storage-tests
      - ingest-tests
      - graph-tests
      - mcp-tests
      - cli-tests
      - release-contract-tests
    steps:
      - name: Tests green
        run: echo "All workspace tests passed; proceeding to release builds."

  release-host:
    name: Release ${{ matrix.asset }}
    needs: release-gate
    runs-on: ${{ matrix.os }}
    permissions:
      attestations: write
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - asset: linux-x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - asset: macos-arm64
            os: macos-15
            target: aarch64-apple-darwin
          - asset: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Determine release version
        shell: bash
        run: |
          version="$(bash release/build-version.sh)"
          echo "MEMPALACE_BUILD_VERSION=$version" >> "$GITHUB_ENV"
          echo "Release version: $version"

      - name: Install protobuf compiler (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      - name: Install protobuf compiler (macOS)
        if: runner.os == 'macOS'
        run: brew install protobuf

      - name: Install protobuf compiler (Windows)
        if: runner.os == 'Windows'
        run: choco install protoc --no-progress -y

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.asset }}

      - name: Build release artifacts
        run: cargo build --release --locked -p mempalace-cli -p mempalace-mcp --target ${{ matrix.target }}

      - name: Stage binaries
        shell: bash
        run: |
          ext=""
          [ "${{ runner.os }}" = "Windows" ] && ext=".exe"
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/mempalace-cli${ext}" "dist/mempalace-cli-${{ matrix.asset }}${ext}"
          cp "target/${{ matrix.target }}/release/mempalace-mcp${ext}" "dist/mempalace-mcp-${{ matrix.asset }}${ext}"

      - name: Smoke packaged binaries
        shell: bash
        run: |
          ext=""
          [ "${{ runner.os }}" = "Windows" ] && ext=".exe"
          "dist/mempalace-cli-${{ matrix.asset }}${ext}" --help
          "dist/mempalace-mcp-${{ matrix.asset }}${ext}" --help
          cli_version="$("dist/mempalace-cli-${{ matrix.asset }}${ext}" --version)"
          mcp_version="$("dist/mempalace-mcp-${{ matrix.asset }}${ext}" --version)"
          [ "$cli_version" = "mempalace-cli $MEMPALACE_BUILD_VERSION" ] \
            || { echo "CLI binary does not report the calculated release version" >&2; exit 1; }
          [ "$mcp_version" = "mempalace-mcp $MEMPALACE_BUILD_VERSION" ] \
            || { echo "MCP binary does not report the calculated release version" >&2; exit 1; }

      - name: Upload release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.asset }}
          path: dist/*
          if-no-files-found: error

      - name: Attest release artifacts
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/*

  publish-nightly:
    name: Publish Immutable Candidate
    runs-on: ubuntu-latest
    environment: stable-release
    needs:
      - release-host
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      attestations: read
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Determine candidate identity
        run: |
          version="$(bash release/build-version.sh)"
          echo "CANDIDATE_TAG=v${version}-nightly.${GITHUB_SHA}" >> "$GITHUB_ENV"
          echo "RELEASE_VERSION=$version" >> "$GITHUB_ENV"

      - name: Require verified immutable-release provisioning
        env:
          IMMUTABLE_RELEASES_ENABLED: ${{ vars.MEMPALACE_IMMUTABLE_RELEASES_ENABLED }}
        run: |
          [ "$IMMUTABLE_RELEASES_ENABLED" = true ] \
            || { echo "immutable releases must be verified by release/configure-repository.ps1 before publishing" >&2; exit 1; }

      - name: Reuse an existing immutable candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$CANDIDATE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            mkdir existing-candidate
            immutable_status="$(
              gh release view "$CANDIDATE_TAG" \
                --repo "$GITHUB_REPOSITORY" \
                --json isImmutable \
                --jq '.isImmutable' 2>/dev/null \
                || echo unknown
            )"
            [ "$immutable_status" = true ] \
              || { echo "existing candidate is not verifiably immutable" >&2; exit 1; }
            gh release download "$CANDIDATE_TAG" --repo "$GITHUB_REPOSITORY" --dir existing-candidate
            gh release verify "$CANDIDATE_TAG" --repo "$GITHUB_REPOSITORY"
            bash release/verify-manifest.sh \
              existing-candidate nightly "$CANDIDATE_TAG" "$RELEASE_VERSION" release/public-key.pem
            while IFS= read -r asset; do
              gh release verify-asset "$CANDIDATE_TAG" "$asset" --repo "$GITHUB_REPOSITORY"
            done < <(bash release/release-files.sh existing-candidate)
            echo "CANDIDATE_EXISTS=true" >> "$GITHUB_ENV"
          else
            echo "CANDIDATE_EXISTS=false" >> "$GITHUB_ENV"
          fi

      - name: Download release artifacts
        if: env.CANDIDATE_EXISTS != 'true'
        uses: actions/download-artifact@v8
        with:
          pattern: release-*
          merge-multiple: true
          path: candidate

      - name: Create signed candidate manifest
        if: env.CANDIDATE_EXISTS != 'true'
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.MEMPALACE_RELEASE_SIGNING_KEY }}
        run: |
          chmod +x candidate/mempalace-* || true
          bash release/create-manifest.sh \
            candidate nightly "$RELEASE_VERSION" "$GITHUB_SHA" "$GITHUB_RUN_ID" "$CANDIDATE_TAG"
          bash release/sign-manifest.sh candidate release/public-key.pem
          bash release/verify-manifest.sh \
            candidate nightly "$CANDIDATE_TAG" "$RELEASE_VERSION" release/public-key.pem

      - name: Publish immutable candidate release
        if: env.CANDIDATE_EXISTS != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mapfile -t release_files < <(bash release/release-files.sh candidate)
          commit_subject="$(git log -1 --format=%s "$GITHUB_SHA")"
          short_sha="${GITHUB_SHA:0:7}"
          title_subject="${commit_subject:0:80}"
          gh release create "$CANDIDATE_TAG" "${release_files[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Candidate v${RELEASE_VERSION} · ${short_sha} · ${title_subject}" \
            --prerelease \
            --latest=false \
            --notes "$(cat <<EOF
            Immutable candidate **v${RELEASE_VERSION}** built from \`main\`.

            - Change: ${commit_subject}
            - Commit: [\`${GITHUB_SHA}\`](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA})
            - CI run: [${GITHUB_RUN_ID}](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})

            Binaries (each as `mempalace-cli-*` and `mempalace-mcp-*`):
            - `linux-x86_64` — glibc (requires glibc 2.38+, set by the bundled ONNX Runtime)
            - `macos-arm64` (Apple Silicon)
            - `windows-x86_64.exe`

            Intel macOS, musl, and older-glibc targets are not shipped: `ort` provides
            no prebuilt ONNX Runtime for them.

            `release-manifest.json` and `SHA256SUMS` are signed by the project
            release key. This is not a stable release.
          EOF
          )"

      - name: Verify published release integrity
        if: env.CANDIDATE_EXISTS != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          immutable_status="$(
            gh release view "$CANDIDATE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --json isImmutable \
              --jq '.isImmutable' 2>/dev/null \
              || echo unknown
          )"
          case "$immutable_status" in
            true)
              ;;
            false)
              gh release delete "$CANDIDATE_TAG" \
                --repo "$GITHUB_REPOSITORY" \
                --cleanup-tag \
                --yes
              echo "published candidate was mutable; release and tag were removed" >&2
              exit 1
              ;;
            *)
              echo "could not determine whether the published candidate is immutable; release left for manual inspection" >&2
              exit 1
              ;;
          esac

          verified=false
          for attempt in {1..12}; do
            if gh release verify "$CANDIDATE_TAG" --repo "$GITHUB_REPOSITORY"; then
              verified=true
              break
            fi
            sleep 5
          done
          [ "$verified" = true ] \
            || { echo "GitHub release attestation did not become available" >&2; exit 1; }
          while IFS= read -r asset; do
            gh release verify-asset "$CANDIDATE_TAG" "$asset" --repo "$GITHUB_REPOSITORY"
          done < <(bash release/release-files.sh candidate)

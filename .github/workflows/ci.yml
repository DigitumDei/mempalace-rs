name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  workspace-build:
    name: Workspace Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install protobuf compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Build all workspace targets
        run: cargo check --workspace --all-targets --locked

  embeddings-tests:
    name: Embeddings Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Build mempalace-embeddings tests
        run: cargo test -p mempalace-embeddings --locked --no-run

      - name: Run mempalace-embeddings tests
        run: cargo test -p mempalace-embeddings --locked -- --nocapture

  remaining-package-tests:
    name: ${{ matrix.package }} Tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - mempalace-config
          - mempalace-core
          - mempalace-dialect
          - mempalace-federation
          - mempalace-import
          - mempalace-remote
          - mempalace-search
          - mempalace-server

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install protobuf compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Build ${{ matrix.package }} tests
        run: cargo test -p ${{ matrix.package }} --locked --no-run

      - name: Run ${{ matrix.package }} tests
        run: cargo test -p ${{ matrix.package }} --locked -- --nocapture

  embedding-baselines:
    name: Embedding Baselines
    runs-on: ubuntu-latest
    needs: embeddings-tests
    timeout-minutes: 30
    env:
      MEMPALACE_EMBED_CACHE: /home/runner/.cache/mempalace/embeddings
      MEMPALACE_EMBED_ALLOW_DOWNLOADS: "1"
      MEMPALACE_EMBED_ITERATIONS: "15"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Cache embedding assets
        uses: actions/cache@v6
        with:
          path: ${{ env.MEMPALACE_EMBED_CACHE }}
          key: embedding-assets-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}

      - name: Capture balanced warm baseline
        run: |
          cargo run -p mempalace-embeddings --example embedding_bench --release --locked \
            | tee balanced-benchmark.txt

      - name: Capture low_cpu warm baseline
        run: |
          MEMPALACE_EMBED_PROFILE=low_cpu \
            cargo run -p mempalace-embeddings --example embedding_bench --release --locked \
            | tee low-cpu-benchmark.txt

      - name: Publish embedding benchmark summary
        run: |
          {
            echo "## Embedding Baselines"
            echo
            echo "$(cat balanced-benchmark.txt)"
            echo "$(cat low-cpu-benchmark.txt)"
            echo
            echo "Reference host: github-actions ubuntu-latest"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload embedding benchmark artifacts
        uses: actions/upload-artifact@v7
        with:
          name: embedding-baselines
          path: |
            balanced-benchmark.txt
            low-cpu-benchmark.txt

  storage-tests:
    name: Storage Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install protobuf compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Build mempalace-storage tests
        run: cargo test -p mempalace-storage --locked --no-run

      - name: Run mempalace-storage tests
        run: cargo test -p mempalace-storage --locked -- --nocapture

  ingest-tests:
    name: Ingest Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install protobuf compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Build mempalace-ingest tests
        run: cargo test -p mempalace-ingest --locked --no-run

      - name: Run mempalace-ingest tests
        run: cargo test -p mempalace-ingest --locked -- --nocapture

  graph-tests:
    name: Graph Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install protobuf compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Build mempalace-graph tests
        run: cargo test -p mempalace-graph --locked --no-run

      - name: Run mempalace-graph tests
        run: cargo test -p mempalace-graph --locked -- --nocapture

  mcp-tests:
    name: MCP Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install protobuf compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Build mempalace-mcp tests
        run: cargo test -p mempalace-mcp --locked --no-run

      - name: Run mempalace-mcp tests
        run: cargo test -p mempalace-mcp --locked -- --nocapture

  cli-tests:
    name: CLI Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install protobuf compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Build mempalace-cli tests
        run: cargo test -p mempalace-cli --locked --no-run

      - name: Run mempalace-cli tests
        run: cargo test -p mempalace-cli --locked -- --nocapture

  release-gate:
    name: Release Gate
    runs-on: ubuntu-latest
    needs:
      - workspace-build
      - embeddings-tests
      - remaining-package-tests
      - embedding-baselines
      - storage-tests
      - ingest-tests
      - graph-tests
      - mcp-tests
      - cli-tests
    steps:
      - name: Tests green
        run: echo "All workspace tests passed; proceeding to release builds."

  release-host:
    name: Release ${{ matrix.asset }}
    needs: release-gate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - asset: linux-x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - asset: macos-arm64
            os: macos-15
            target: aarch64-apple-darwin
          - asset: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install protobuf compiler (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      - name: Install protobuf compiler (macOS)
        if: runner.os == 'macOS'
        run: brew install protobuf

      - name: Install protobuf compiler (Windows)
        if: runner.os == 'Windows'
        run: choco install protoc --no-progress -y

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.asset }}

      - name: Build release artifacts
        run: cargo build --release --locked -p mempalace-cli -p mempalace-mcp --target ${{ matrix.target }}

      - name: Stage binaries
        shell: bash
        run: |
          ext=""
          [ "${{ runner.os }}" = "Windows" ] && ext=".exe"
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/mempalace-cli${ext}" "dist/mempalace-cli-${{ matrix.asset }}${ext}"
          cp "target/${{ matrix.target }}/release/mempalace-mcp${ext}" "dist/mempalace-mcp-${{ matrix.asset }}${ext}"

      - name: Smoke packaged binaries
        shell: bash
        run: |
          ext=""
          [ "${{ runner.os }}" = "Windows" ] && ext=".exe"
          "dist/mempalace-cli-${{ matrix.asset }}${ext}" --help
          "dist/mempalace-mcp-${{ matrix.asset }}${ext}" --help

      - name: Upload release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.asset }}
          path: dist/*
          if-no-files-found: error

  publish-candidate:
    name: Publish Candidate Release
    runs-on: ubuntu-latest
    needs:
      - release-host
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
      attestations: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install OpenSSL (for signing)
        run: |
          sudo apt-get update
          sudo apt-get install -y openssl

      - name: Download release artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: release-*
          merge-multiple: true
          path: candidate

      - name: Stage candidate assets and compute metadata
        id: metadata
        shell: bash
        env:
          SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          chmod +x candidate/mempalace-* || true
          cd candidate

          SHORT_SHA="${GITHUB_SHA::7}"

          # Build structured manifest
          ASSETS_JSON="["
          FIRST=true
          for f in mempalace-cli-* mempalace-mcp-*; do
            [ -f "$f" ] || continue
            DIGEST=$(sha256sum "$f" | cut -d' ' -f1)
            SIZE=$(stat -c%s "$f" 2>/dev/null || stat -f%z "$f" 2>/dev/null || echo 0)
            NAME="$f"
            if [ "$FIRST" = true ]; then FIRST=false; else ASSETS_JSON+=","; fi
            ASSETS_JSON+="{\"name\":\"$NAME\",\"sha256\":\"$DIGEST\",\"size\":$SIZE}"
          done
          ASSETS_JSON+="]"

          # Write manifest
          cat > manifest.json <<MANIFEST_EOF
          {
            "version": "0.0.0-nightly.${SHORT_SHA}",
            "commit": "${GITHUB_SHA}",
            "run_id": ${GITHUB_RUN_ID},
            "run_attempt": ${GITHUB_RUN_ATTEMPT},
            "tag": "nightly-${GITHUB_SHA}",
            "channel": "nightly",
            "assets": ${ASSETS_JSON}
          }
          MANIFEST_EOF

          # Write SHA256SUMS
          sha256sum mempalace-cli-* mempalace-mcp-* > SHA256SUMS

          # Sign manifest and SHA256SUMS
          PRIVKEY_FILE="$(mktemp)"
          trap 'rm -f "${PRIVKEY_FILE}"' EXIT
          printf '%s\n' "${SIGNING_KEY}" > "${PRIVKEY_FILE}"
          openssl dgst -sha256 -sign "${PRIVKEY_FILE}" -out manifest.json.sig manifest.json
          openssl dgst -sha256 -sign "${PRIVKEY_FILE}" -out SHA256SUMS.sig SHA256SUMS
          rm -f "${PRIVKEY_FILE}"

          # Compute commit tag
          echo "CANDIDATE_TAG=nightly-${GITHUB_SHA}" >> "$GITHUB_ENV"
          echo "CANDIDATE_NAME=Candidate (${GITHUB_SHA})" >> "$GITHUB_ENV"

      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: |
            candidate/mempalace-cli-*
            candidate/mempalace-mcp-*
            candidate/manifest.json
            candidate/SHA256SUMS
            candidate/manifest.json.sig
            candidate/SHA256SUMS.sig

      - name: Publish immutable candidate release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: nightly-${{ github.sha }}
          name: Candidate (${{ github.sha }})
          body: |
            Immutable candidate build from `main` @ `${{ github.sha }}`.

            **Binaries** (each as `mempalace-cli-*` and `mempalace-mcp-*`):
            - `linux-x86_64` — glibc (requires glibc 2.38+)
            - `macos-arm64` (Apple Silicon)
            - `windows-x86_64.exe`

            **Artifacts:**
            - `manifest.json` — structured metadata (version, commit, run, asset digests/sizes)
            - `manifest.json.sig` — Ed25519 signature over raw manifest bytes
            - `SHA256SUMS` — per-file checksums
            - `SHA256SUMS.sig` — Ed25519 signature over raw SHA256SUMS bytes

            Verify with the committed public key (`release/public-key.pem`):
            ```shell
            openssl dgst -sha256 -verify release/public-key.pem \
              -signature manifest.json.sig manifest.json
            ```

            This is a **candidate prerelease** keyed to this exact commit.
            Promote to stable via the "Promote Release" workflow.
          prerelease: true
          make_latest: false
          target_commitish: ${{ github.sha }}
          files: |
            candidate/mempalace-cli-*
            candidate/mempalace-mcp-*
            candidate/manifest.json
            candidate/manifest.json.sig
            candidate/SHA256SUMS
            candidate/SHA256SUMS.sig
          fail_on_unmatched_files: true

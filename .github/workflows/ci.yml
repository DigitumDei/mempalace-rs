name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  workspace-build:
    name: Workspace Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install protobuf compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Build all workspace targets
        run: cargo check --workspace --all-targets --locked

  embeddings-tests:
    name: Embeddings Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Build mempalace-embeddings tests
        run: cargo test -p mempalace-embeddings --locked --no-run

      - name: Run mempalace-embeddings tests
        run: cargo test -p mempalace-embeddings --locked -- --nocapture

  remaining-package-tests:
    name: ${{ matrix.package }} Tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - mempalace-config
          - mempalace-core
          - mempalace-dialect
          - mempalace-federation
          - mempalace-import
          - mempalace-remote
          - mempalace-search
          - mempalace-server

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install protobuf compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Build ${{ matrix.package }} tests
        run: cargo test -p ${{ matrix.package }} --locked --no-run

      - name: Run ${{ matrix.package }} tests
        run: cargo test -p ${{ matrix.package }} --locked -- --nocapture

  embedding-baselines:
    name: Embedding Baselines
    runs-on: ubuntu-latest
    needs: embeddings-tests
    timeout-minutes: 30
    env:
      MEMPALACE_EMBED_CACHE: /home/runner/.cache/mempalace/embeddings
      MEMPALACE_EMBED_ALLOW_DOWNLOADS: "1"
      MEMPALACE_EMBED_ITERATIONS: "15"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Cache embedding assets
        uses: actions/cache@v6
        with:
          path: ${{ env.MEMPALACE_EMBED_CACHE }}
          key: embedding-assets-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}

      - name: Capture balanced warm baseline
        run: |
          cargo run -p mempalace-embeddings --example embedding_bench --release --locked \
            | tee balanced-benchmark.txt

      - name: Capture low_cpu warm baseline
        run: |
          MEMPALACE_EMBED_PROFILE=low_cpu \
            cargo run -p mempalace-embeddings --example embedding_bench --release --locked \
            | tee low-cpu-benchmark.txt

      - name: Publish embedding benchmark summary
        run: |
          {
            echo "## Embedding Baselines"
            echo
            echo "$(cat balanced-benchmark.txt)"
            echo "$(cat low-cpu-benchmark.txt)"
            echo
            echo "Reference host: github-actions ubuntu-latest"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload embedding benchmark artifacts
        uses: actions/upload-artifact@v7
        with:
          name: embedding-baselines
          path: |
            balanced-benchmark.txt
            low-cpu-benchmark.txt

  storage-tests:
    name: Storage Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install protobuf compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Build mempalace-storage tests
        run: cargo test -p mempalace-storage --locked --no-run

      - name: Run mempalace-storage tests
        run: cargo test -p mempalace-storage --locked -- --nocapture

  ingest-tests:
    name: Ingest Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install protobuf compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Build mempalace-ingest tests
        run: cargo test -p mempalace-ingest --locked --no-run

      - name: Run mempalace-ingest tests
        run: cargo test -p mempalace-ingest --locked -- --nocapture

  graph-tests:
    name: Graph Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install protobuf compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Build mempalace-graph tests
        run: cargo test -p mempalace-graph --locked --no-run

      - name: Run mempalace-graph tests
        run: cargo test -p mempalace-graph --locked -- --nocapture

  mcp-tests:
    name: MCP Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install protobuf compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Build mempalace-mcp tests
        run: cargo test -p mempalace-mcp --locked --no-run

      - name: Run mempalace-mcp tests
        run: cargo test -p mempalace-mcp --locked -- --nocapture

  cli-tests:
    name: CLI Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install protobuf compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Build mempalace-cli tests
        run: cargo test -p mempalace-cli --locked --no-run

      - name: Run mempalace-cli tests
        run: cargo test -p mempalace-cli --locked -- --nocapture

  release-gate:
    name: Release Gate
    runs-on: ubuntu-latest
    needs:
      - workspace-build
      - embeddings-tests
      - remaining-package-tests
      - embedding-baselines
      - storage-tests
      - ingest-tests
      - graph-tests
      - mcp-tests
      - cli-tests
    steps:
      - name: Tests green
        run: echo "All workspace tests passed; proceeding to release builds."

  release-host:
    name: Release ${{ matrix.asset }}
    needs: release-gate
    runs-on: ${{ matrix.os }}
    permissions:
      attestations: write
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - asset: linux-x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - asset: macos-arm64
            os: macos-15
            target: aarch64-apple-darwin
          - asset: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install protobuf compiler (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      - name: Install protobuf compiler (macOS)
        if: runner.os == 'macOS'
        run: brew install protobuf

      - name: Install protobuf compiler (Windows)
        if: runner.os == 'Windows'
        run: choco install protoc --no-progress -y

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.asset }}

      - name: Build release artifacts
        run: cargo build --release --locked -p mempalace-cli -p mempalace-mcp --target ${{ matrix.target }}

      - name: Stage binaries
        shell: bash
        run: |
          ext=""
          [ "${{ runner.os }}" = "Windows" ] && ext=".exe"
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/mempalace-cli${ext}" "dist/mempalace-cli-${{ matrix.asset }}${ext}"
          cp "target/${{ matrix.target }}/release/mempalace-mcp${ext}" "dist/mempalace-mcp-${{ matrix.asset }}${ext}"

      - name: Smoke packaged binaries
        shell: bash
        run: |
          ext=""
          [ "${{ runner.os }}" = "Windows" ] && ext=".exe"
          "dist/mempalace-cli-${{ matrix.asset }}${ext}" --help
          "dist/mempalace-mcp-${{ matrix.asset }}${ext}" --help

      - name: Upload release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.asset }}
          path: dist/*
          if-no-files-found: error

      - name: Attest release artifacts
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: dist/*

  publish-nightly:
    name: Publish Nightly Release
    runs-on: ubuntu-latest
    environment: stable-release
    needs:
      - release-host
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download release artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: release-*
          merge-multiple: true
          path: candidate

      - name: Create signed candidate manifest
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.MEMPALACE_RELEASE_SIGNING_KEY }}
        run: |
          test -n "$RELEASE_SIGNING_KEY" || { echo "MEMPALACE_RELEASE_SIGNING_KEY is required" >&2; exit 1; }
          tag="nightly-${GITHUB_SHA}"
          version="$(cargo metadata --no-deps --format-version=1 | jq -r '.packages[] | select(.name == "mempalace-cli") | .version')"
          test -n "$version" && test "$version" != "null" || { echo "could not determine package version" >&2; exit 1; }
          chmod +x candidate/mempalace-* || true
          (cd candidate && sha256sum mempalace-* > SHA256SUMS)
          assets="$(for asset in candidate/mempalace-*; do
            name="${asset##*/}"
            target="${name#mempalace-cli-}"
            target="${target#mempalace-mcp-}"
            target="${target%.exe}"
            jq -n --arg name "$name" --arg target "$target" --arg sha "$(sha256sum "$asset" | cut -d' ' -f1)" --argjson size "$(wc -c < "$asset")" '{name: $name, target: $target, sha256: $sha, size: $size}'
          done | jq -s .)"
          jq -n --arg version "$version" --arg commit "$GITHUB_SHA" --arg run "$GITHUB_RUN_ID" --arg tag "$tag" --argjson assets "$assets" '{schema_version: 1, channel: "nightly", version: $version, commit_sha: $commit, run_id: $run, release_tag: $tag, assets: $assets}' > candidate/release-manifest.json
          printf '%s' "$RELEASE_SIGNING_KEY" | base64 --decode > signing-key.pem
          openssl dgst -sha256 -sign signing-key.pem -out candidate/release-manifest.sig candidate/release-manifest.json
          openssl dgst -sha256 -sign signing-key.pem -out candidate/SHA256SUMS.sig candidate/SHA256SUMS
          rm -f signing-key.pem
          echo "CANDIDATE_TAG=$tag" >> "$GITHUB_ENV"

      - name: Refuse to overwrite an existing candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$CANDIDATE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 && { echo "candidate release already exists" >&2; exit 1; } || true

      - name: Publish immutable candidate release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.CANDIDATE_TAG }}
          name: Candidate ${{ env.CANDIDATE_TAG }}
          body: |
            Immutable candidate build from `main` @ ${{ github.sha }}.

            Binaries (each as `mempalace-cli-*` and `mempalace-mcp-*`):
            - `linux-x86_64` — glibc (requires glibc 2.38+, set by the bundled ONNX Runtime)
            - `macos-arm64` (Apple Silicon)
            - `windows-x86_64.exe`

            Intel macOS, musl, and older-glibc targets are not shipped: `ort` provides
            no prebuilt ONNX Runtime for them.

            `release-manifest.json` and `SHA256SUMS` are signed by the project
            release key. This is not a stable release.
          prerelease: true
          make_latest: false
          target_commitish: ${{ github.sha }}
          files: candidate/*
          fail_on_unmatched_files: true

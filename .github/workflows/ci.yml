name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  workspace-build:
    name: Workspace Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install protobuf compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Build all workspace targets
        run: cargo check --workspace --all-targets --locked

  embeddings-tests:
    name: Embeddings Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Build mempalace-embeddings tests
        run: cargo test -p mempalace-embeddings --locked --no-run

      - name: Run mempalace-embeddings tests
        run: cargo test -p mempalace-embeddings --locked -- --nocapture

  remaining-package-tests:
    name: ${{ matrix.package }} Tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - mempalace-config
          - mempalace-core
          - mempalace-dialect
          - mempalace-federation
          - mempalace-import
          - mempalace-remote
          - mempalace-search
          - mempalace-server

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install protobuf compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Build ${{ matrix.package }} tests
        run: cargo test -p ${{ matrix.package }} --locked --no-run

      - name: Run ${{ matrix.package }} tests
        run: cargo test -p ${{ matrix.package }} --locked -- --nocapture

  embedding-baselines:
    name: Embedding Baselines
    runs-on: ubuntu-latest
    needs: embeddings-tests
    timeout-minutes: 30
    env:
      MEMPALACE_EMBED_CACHE: /home/runner/.cache/mempalace/embeddings
      MEMPALACE_EMBED_ALLOW_DOWNLOADS: "1"
      MEMPALACE_EMBED_ITERATIONS: "15"

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Cache embedding assets
        uses: actions/cache@v4
        with:
          path: ${{ env.MEMPALACE_EMBED_CACHE }}
          key: embedding-assets-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}

      - name: Capture balanced warm baseline
        run: |
          cargo run -p mempalace-embeddings --example embedding_bench --release --locked \
            | tee balanced-benchmark.txt

      - name: Capture low_cpu warm baseline
        run: |
          MEMPALACE_EMBED_PROFILE=low_cpu \
            cargo run -p mempalace-embeddings --example embedding_bench --release --locked \
            | tee low-cpu-benchmark.txt

      - name: Publish embedding benchmark summary
        run: |
          {
            echo "## Embedding Baselines"
            echo
            echo "$(cat balanced-benchmark.txt)"
            echo "$(cat low-cpu-benchmark.txt)"
            echo
            echo "Reference host: github-actions ubuntu-latest"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload embedding benchmark artifacts
        uses: actions/upload-artifact@v4
        with:
          name: embedding-baselines
          path: |
            balanced-benchmark.txt
            low-cpu-benchmark.txt

  storage-tests:
    name: Storage Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install protobuf compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Build mempalace-storage tests
        run: cargo test -p mempalace-storage --locked --no-run

      - name: Run mempalace-storage tests
        run: cargo test -p mempalace-storage --locked -- --nocapture

  ingest-tests:
    name: Ingest Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install protobuf compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Build mempalace-ingest tests
        run: cargo test -p mempalace-ingest --locked --no-run

      - name: Run mempalace-ingest tests
        run: cargo test -p mempalace-ingest --locked -- --nocapture

  graph-tests:
    name: Graph Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install protobuf compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Build mempalace-graph tests
        run: cargo test -p mempalace-graph --locked --no-run

      - name: Run mempalace-graph tests
        run: cargo test -p mempalace-graph --locked -- --nocapture

  mcp-tests:
    name: MCP Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install protobuf compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Build mempalace-mcp tests
        run: cargo test -p mempalace-mcp --locked --no-run

      - name: Run mempalace-mcp tests
        run: cargo test -p mempalace-mcp --locked -- --nocapture

  cli-tests:
    name: CLI Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install protobuf compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Build mempalace-cli tests
        run: cargo test -p mempalace-cli --locked --no-run

      - name: Run mempalace-cli tests
        run: cargo test -p mempalace-cli --locked -- --nocapture

  release-gate:
    name: Release Gate
    runs-on: ubuntu-latest
    needs:
      - workspace-build
      - embeddings-tests
      - remaining-package-tests
      - embedding-baselines
      - storage-tests
      - ingest-tests
      - graph-tests
      - mcp-tests
      - cli-tests
    steps:
      - name: Tests green
        run: echo "All workspace tests passed; proceeding to release builds."

  release-host:
    name: Release ${{ matrix.asset }}
    needs: release-gate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - asset: linux-x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - asset: macos-arm64
            os: macos-latest
            target: aarch64-apple-darwin
          - asset: macos-x86_64
            os: macos-latest
            target: x86_64-apple-darwin
            cross: true
          - asset: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install protobuf compiler (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      - name: Install protobuf compiler (macOS)
        if: runner.os == 'macOS'
        run: brew install protobuf

      - name: Install protobuf compiler (Windows)
        if: runner.os == 'Windows'
        run: choco install protoc --no-progress -y

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.asset }}

      - name: Build release artifacts
        run: cargo build --release --locked -p mempalace-cli -p mempalace-mcp --target ${{ matrix.target }}

      - name: Stage binaries
        shell: bash
        run: |
          ext=""
          [ "${{ runner.os }}" = "Windows" ] && ext=".exe"
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/mempalace-cli${ext}" "dist/mempalace-cli-${{ matrix.asset }}${ext}"
          cp "target/${{ matrix.target }}/release/mempalace-mcp${ext}" "dist/mempalace-mcp-${{ matrix.asset }}${ext}"

      - name: Smoke packaged binaries
        # The macOS x86_64 binary is cross-compiled on an arm64 runner, so it cannot run here.
        if: ${{ !matrix.cross }}
        shell: bash
        run: |
          ext=""
          [ "${{ runner.os }}" = "Windows" ] && ext=".exe"
          "dist/mempalace-cli-${{ matrix.asset }}${ext}" --help
          "dist/mempalace-mcp-${{ matrix.asset }}${ext}" --help

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.asset }}
          path: dist/*
          if-no-files-found: error

  release-manylinux:
    name: Release linux-x86_64-manylinux
    needs: release-gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # Cache the container build's CARGO_HOME / RUSTUP_HOME / target on the host
      # (the build runs as root inside the container against these mounted paths).
      - name: Cache cargo artifacts
        uses: actions/cache@v4
        with:
          path: |
            .cargo-home/registry
            .cargo-home/git
            .rustup-home
            target
          key: manylinux-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            manylinux-

      # Compile inside manylinux_2_28 (glibc 2.28 baseline) so the binary runs in
      # older containers. checkout/upload stay on the host to avoid the
      # node-in-container requirement of JS actions. ort ships glibc prebuilts, so
      # no musl is involved (see issue #14 / PR #12).
      - name: Build in manylinux_2_28 container
        run: |
          docker run --rm \
            -v "$PWD":/io -w /io \
            -e CARGO_HOME=/io/.cargo-home \
            -e RUSTUP_HOME=/io/.rustup-home \
            -e CARGO_TERM_COLOR=always \
            quay.io/pypa/manylinux_2_28_x86_64 \
            bash -euxo pipefail -c '
              yum -y install unzip >/dev/null
              protoc_version=25.1
              curl -sSL -o /tmp/protoc.zip \
                "https://github.com/protocolbuffers/protobuf/releases/download/v${protoc_version}/protoc-${protoc_version}-linux-x86_64.zip"
              unzip -o /tmp/protoc.zip -d /usr/local
              export PATH="/usr/local/bin:$PATH"
              protoc --version
              curl --proto "=https" --tlsv1.2 -sSf https://sh.rustup.rs | \
                sh -s -- -y --profile minimal --default-toolchain stable
              export PATH="$CARGO_HOME/bin:$PATH"
              rustc --version
              cargo build --release --locked -p mempalace-cli -p mempalace-mcp
            '

      - name: Stage binaries
        run: |
          mkdir -p dist
          cp target/release/mempalace-cli dist/mempalace-cli-linux-x86_64-manylinux
          cp target/release/mempalace-mcp dist/mempalace-mcp-linux-x86_64-manylinux
          chmod +x dist/*

      - name: Smoke packaged binaries
        run: |
          dist/mempalace-cli-linux-x86_64-manylinux --help
          dist/mempalace-mcp-linux-x86_64-manylinux --help

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-linux-x86_64-manylinux
          path: dist/*
          if-no-files-found: error

  publish-nightly:
    name: Publish Nightly Release
    runs-on: ubuntu-latest
    needs:
      - release-host
      - release-manylinux
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: nightly

      - name: Stage nightly assets
        run: |
          short_sha="${GITHUB_SHA::7}"
          chmod +x nightly/mempalace-* || true
          (cd nightly && sha256sum * > SHA256SUMS)
          echo "SHORT_SHA=$short_sha" >> "$GITHUB_ENV"

      - name: Publish rolling nightly release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          name: Nightly (${{ env.SHORT_SHA }})
          body: |
            Rolling nightly build from `main` @ ${{ github.sha }}.

            Binaries (each as `mempalace-cli-*` and `mempalace-mcp-*`):
            - `linux-x86_64` — glibc, built on ubuntu-latest (needs a recent glibc)
            - `linux-x86_64-manylinux` — glibc 2.28+ baseline, runs in older containers
            - `macos-arm64`, `macos-x86_64`
            - `windows-x86_64.exe`

            `SHA256SUMS` lists checksums for every asset.
            Overwritten on every push to `main`. Not a stable release.
          prerelease: true
          make_latest: false
          target_commitish: ${{ github.sha }}
          files: nightly/*
          fail_on_unmatched_files: true

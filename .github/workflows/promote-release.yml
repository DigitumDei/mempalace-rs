name: promote-release

on:
  workflow_dispatch:
    inputs:
      candidate_tag:
        description: Immutable v<version>-nightly.<commit> tag to promote
        required: true
        type: string

permissions:
  attestations: read
  contents: write

jobs:
  promote:
    name: Promote tested candidate
    runs-on: ubuntu-latest
    environment: stable-release
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout trusted release policy
        uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false

      - name: Validate release request and repository policy
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_TAG: ${{ inputs.candidate_tag }}
          IMMUTABLE_RELEASES_ENABLED: ${{ vars.MEMPALACE_IMMUTABLE_RELEASES_ENABLED }}
        run: |
          [[ "$CANDIDATE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)-nightly\.[0-9a-f]{40}$ ]] \
            || { echo "candidate tag must be v<version>-nightly.<full-commit-sha>" >&2; exit 1; }
          [ "$IMMUTABLE_RELEASES_ENABLED" = true ] \
            || { echo "immutable releases must be verified by release/configure-repository.ps1 before promotion" >&2; exit 1; }

      - name: Download exact immutable candidate
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_TAG: ${{ inputs.candidate_tag }}
        run: |
          mkdir candidate-assets
          immutable_status="$(
            gh release view "$CANDIDATE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --json isImmutable \
              --jq '.isImmutable' 2>/dev/null \
              || echo unknown
          )"
          [ "$immutable_status" = true ] \
            || { echo "candidate is not verifiably immutable" >&2; exit 1; }
          gh release verify "$CANDIDATE_TAG" --repo "$GITHUB_REPOSITORY"
          gh release download "$CANDIDATE_TAG" --repo "$GITHUB_REPOSITORY" --dir candidate-assets
          candidate_version="$(jq -r '.version // empty' candidate-assets/release-manifest.json)"
          [[ "$candidate_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] \
            || { echo "candidate manifest version must be semantic" >&2; exit 1; }
          echo "RELEASE_VERSION=$candidate_version" >> "$GITHUB_ENV"
          while IFS= read -r asset; do
            gh release verify-asset "$CANDIDATE_TAG" "$asset" --repo "$GITHUB_REPOSITORY"
          done < <(bash release/release-files.sh candidate-assets)

      - name: Verify candidate signatures, identity, assets, and provenance
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_TAG: ${{ inputs.candidate_tag }}
        run: |
          bash release/verify-manifest.sh \
            candidate-assets nightly "$CANDIDATE_TAG" "$RELEASE_VERSION" release/public-key.pem

          manifest_commit="$(jq -r '.commit_sha' candidate-assets/release-manifest.json)"
          [ "$CANDIDATE_TAG" = "v${RELEASE_VERSION}-nightly.${manifest_commit}" ] \
            || { echo "candidate tag does not match manifest version and commit" >&2; exit 1; }
          tag_commit="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$CANDIDATE_TAG" --jq '.object.sha')"
          [ "$tag_commit" = "$manifest_commit" ] \
            || { echo "candidate Git tag does not target the manifest commit" >&2; exit 1; }

          if gh release view "v$RELEASE_VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "stable release already exists" >&2
            exit 1
          fi
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v$RELEASE_VERSION" >/dev/null 2>&1; then
            echo "stable tag already exists" >&2
            exit 1
          fi

          for asset in candidate-assets/mempalace-*; do
            gh attestation verify "$asset" \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/ci.yml" \
              --source-ref refs/heads/main \
              --source-digest "$manifest_commit" \
              --deny-self-hosted-runners
          done

      - name: Create and verify signed stable manifest
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.MEMPALACE_RELEASE_SIGNING_KEY }}
        run: |
          bash release/promote-manifest.sh candidate-assets "$RELEASE_VERSION"
          bash release/sign-manifest.sh candidate-assets release/public-key.pem
          bash release/verify-manifest.sh \
            candidate-assets stable "v$RELEASE_VERSION" "$RELEASE_VERSION" release/public-key.pem

      - name: Publish immutable stable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mapfile -t release_files < <(bash release/release-files.sh candidate-assets)
          gh release create "v$RELEASE_VERSION" "${release_files[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$(jq -r '.commit_sha' candidate-assets/release-manifest.json)" \
            --title "v$RELEASE_VERSION" \
            --generate-notes \
            --latest

      - name: Verify published stable release integrity
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          immutable_status="$(
            gh release view "v$RELEASE_VERSION" \
              --repo "$GITHUB_REPOSITORY" \
              --json isImmutable \
              --jq '.isImmutable' 2>/dev/null \
              || echo unknown
          )"
          case "$immutable_status" in
            true)
              ;;
            false)
              gh release delete "v$RELEASE_VERSION" \
                --repo "$GITHUB_REPOSITORY" \
                --cleanup-tag \
                --yes
              echo "published stable release was mutable; release and tag were removed" >&2
              exit 1
              ;;
            *)
              echo "could not determine whether the published stable release is immutable; release left for manual inspection" >&2
              exit 1
              ;;
          esac

          verified=false
          for attempt in {1..12}; do
            if gh release verify "v$RELEASE_VERSION" --repo "$GITHUB_REPOSITORY"; then
              verified=true
              break
            fi
            sleep 5
          done
          [ "$verified" = true ] \
            || { echo "GitHub release attestation did not become available" >&2; exit 1; }
          while IFS= read -r asset; do
            gh release verify-asset "v$RELEASE_VERSION" "$asset" --repo "$GITHUB_REPOSITORY"
          done < <(bash release/release-files.sh candidate-assets)

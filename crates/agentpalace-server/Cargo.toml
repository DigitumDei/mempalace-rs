[package]
name = "agentpalace-server"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Federation HTTP server exposing an AgentPalace palace over REST with bearer-token auth."

[dependencies]
agentpalace-config = { path = "../agentpalace-config" }
agentpalace-core = { path = "../agentpalace-core" }
agentpalace-embeddings = { path = "../agentpalace-embeddings" }
agentpalace-graph = { path = "../agentpalace-graph" }
agentpalace-search = { path = "../agentpalace-search" }
agentpalace-storage = { path = "../agentpalace-storage" }
agentpalace-federation = { path = "../agentpalace-federation" }

axum = { version = "0.8", default-features = true }
blake3.workspace = true
serde.workspace = true
serde_json.workspace = true
subtle = "2.6"
thiserror.workspace = true
time.workspace = true
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread", "sync", "net", "time", "process"] }
tracing.workspace = true

[dev-dependencies]
tempfile = "3.23.0"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
# Also used for seeding a legacy pre-wings coordination row directly (issue #102
# Stage 8 test), the same way agentpalace-storage's own upgrade tests do —
# `CoordinationStore::create_task` refuses `wing_unscoped` outright, so a row
# on it can only be produced by writing straight to the same sqlite file.
rusqlite = { version = "0.39.0", features = ["bundled"] }

[lints]
workspace = true

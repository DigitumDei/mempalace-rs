[package]
name = "mempalace-remote"
description = "HTTP client for the MemPalace federation REST API."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
async-trait = "0.1.89"
mempalace-federation = { path = "../mempalace-federation" }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { version = "1.48.0", features = ["sync"] }
tracing.workspace = true

[dev-dependencies]
axum = { version = "0.8", default-features = true }
mempalace-config = { path = "../mempalace-config" }
mempalace-core = { path = "../mempalace-core" }
mempalace-embeddings = { path = "../mempalace-embeddings" }
mempalace-server = { path = "../mempalace-server" }
tempfile = "3.23.0"
tokio = { version = "1.48.0", features = ["macros", "net", "rt-multi-thread", "sync"] }

[lints]
workspace = true

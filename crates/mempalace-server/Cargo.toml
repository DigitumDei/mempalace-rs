[package]
name = "mempalace-server"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Federation HTTP server exposing a MemPalace palace over REST with bearer-token auth."

[dependencies]
mempalace-config = { path = "../mempalace-config" }
mempalace-core = { path = "../mempalace-core" }
mempalace-embeddings = { path = "../mempalace-embeddings" }
mempalace-graph = { path = "../mempalace-graph" }
mempalace-search = { path = "../mempalace-search" }
mempalace-storage = { path = "../mempalace-storage" }
mempalace-federation = { path = "../mempalace-federation" }

axum = { version = "0.8", default-features = true }
blake3.workspace = true
serde.workspace = true
serde_json.workspace = true
subtle = "2.6"
thiserror.workspace = true
time.workspace = true
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread", "sync", "net"] }
tracing.workspace = true

[dev-dependencies]
tempfile = "3.23.0"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[lints]
workspace = true
